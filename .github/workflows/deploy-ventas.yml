# CI/CD como proyecto-devops-deploy: ECR + SSM (sin SSH desde GitHub).
# Secretos: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION,
#   ECR_REGISTRY, ECR_REPO_URL_BACKEND, EC2_BACKEND_INSTANCE_ID,
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# La instancia backend necesita: Docker, SSM Agent, rol IAM con ECR pull + ssm:SendCommand.

name: CI/CD - Backend Ventas

on:
  push:
    branches: [deploy, main, master]
    paths:
      - "back-Ventas_SpringBoot/**"
      - ".github/workflows/deploy-ventas.yml"
  workflow_dispatch:

concurrency:
  group: ecr-ssm-ventas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Imagen (Etiqueta ventas-v1)
        env:
          ECR_REPO_URL_BACKEND: ${{ secrets.ECR_REPO_URL_BACKEND }}
        run: |
          docker build -t "${ECR_REPO_URL_BACKEND}:ventas-v1" ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push "${ECR_REPO_URL_BACKEND}:ventas-v1"

      - name: Desplegar en EC2 Backend vía SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_BACKEND_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          ECR_REG: ${{ secrets.ECR_REGISTRY }}
          IMG: ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-v1
          JDBC_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          JDBC_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          JDBC_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, shlex
          from pathlib import Path

          region = os.environ["REGION"]
          ecr_reg = os.environ["ECR_REG"]
          img = os.environ["IMG"]
          jdbc = os.environ["JDBC_URL"]
          ju = os.environ["JDBC_USER"]
          jp = os.environ["JDBC_PASS"]

          login = f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {ecr_reg}"
          pull = f"docker pull {img}"
          stop = "docker stop ventas-api || true"
          rm = "docker rm ventas-api || true"
          run_cmd = (
              "docker run -d --name ventas-api --restart unless-stopped -p 8082:8080 "
              f"-e SPRING_DATASOURCE_URL={shlex.quote(jdbc)} "
              f"-e SPRING_DATASOURCE_USERNAME={shlex.quote(ju)} "
              f"-e SPRING_DATASOURCE_PASSWORD={shlex.quote(jp)} "
              f"{shlex.quote(img)}"
          )
          Path("params.json").write_text(
              json.dumps({"commands": [login, pull, stop, rm, run_cmd]})
          )
          PY
          aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --region "${REGION}"

# Build de Vite/React y copia a EC2-Web (Nginx sirve /var/www/html).
# Secretos: EC2_FRONTEND_HOST, EC2_USER, EC2_SSH_KEY
# EC2_SSH_KEY: clave PRIVADA .pem (multilínea) O la misma clave codificada en Base64 (una sola línea, sin espacios).
# Tras "Huella de la clave", compara con EC2 → Par de claves → Huella digital (MD5 o SHA256).
# La EC2 debe permitir sudo sin contraseña para nginx y /var/www/html (o ajusta el script).

name: Deploy frontend

on:
  push:
    branches: [main, master]
    paths:
      - "front_despacho/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Install and build
        working-directory: front_despacho
        env:
          VITE_VENTAS_API_BASE: /api/ventas
          VITE_DESPACHOS_API_BASE: /api/despachos
        run: npm ci && npm run build

      - name: Pack static site
        run: tar -czf frontend-dist.tgz -C front_despacho/dist .

      - name: Upload and publish over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_FRONTEND_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEYFILE="${HOME}/.ssh/ec2_deploy_key"
          RAW="$(printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r')"
          if echo "$RAW" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$RAW" > "$KEYFILE"
          else
            printf '%s' "$RAW" | tr -d '\n ' | base64 -d > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          grep -q "BEGIN.*PRIVATE KEY" "$KEYFILE" || { echo "::error::EC2_SSH_KEY: no es una clave PRIVADA válida (PEM o Base64 del .pem)."; exit 1; }
          echo "::notice::Huella de la clave usada en CI (debe coincidir con el par de claves de la instancia en AWS):"
          ssh-keygen -lf "$KEYFILE" -E md5 2>/dev/null || ssh-keygen -lf "$KEYFILE" 2>/dev/null || true
          BYTES="$(wc -c < "$KEYFILE")"
          echo "::notice::Tamaño clave privada: ${BYTES} bytes (si es < 200, el secreto puede estar truncado)."
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          COMMON_SSH_OPTS="-i ${KEYFILE} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          scp $COMMON_SSH_OPTS frontend-dist.tgz "${USER}@${HOST}:/tmp/frontend-dist.tgz"
          ssh $COMMON_SSH_OPTS "${USER}@${HOST}" \
            "set -e; sudo mkdir -p /var/www/html; sudo tar -xzf /tmp/frontend-dist.tgz -C /var/www/html; sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload"

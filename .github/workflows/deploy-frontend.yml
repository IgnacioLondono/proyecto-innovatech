# Build de Vite/React y copia a EC2-Web (Nginx sirve /var/www/html).
# Secretos: mismos AWS_* que los backends + EC2_FRONTEND_HOST, EC2_USER, EC2_SSH_KEY
# La instancia debe permitir escribir en FRONTEND_WEB_ROOT (sudo sin contraseña o usuario con permisos).

name: Deploy frontend

on:
  push:
    branches: [main, master]
    paths:
      - "front_despacho/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Install and build
        working-directory: front_despacho
        env:
          VITE_VENTAS_API_BASE: /api/ventas
          VITE_DESPACHOS_API_BASE: /api/despachos
        run: npm ci && npm run build

      - name: Pack static site
        run: tar -czf frontend-dist.tgz -C front_despacho/dist .

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend-dist.tgz
          target: /tmp/

      - name: Extract and publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            sudo mkdir -p /var/www/html
            sudo tar -xzf /tmp/frontend-dist.tgz -C /var/www/html
            sudo systemctl reload nginx || sudo nginx -s reload

# Build de Vite/React y copia a EC2-Web (Nginx sirve /var/www/html).
# Secretos: EC2_FRONTEND_HOST, EC2_USER, EC2_SSH_KEY
# La EC2 debe permitir sudo sin contraseña para nginx y /var/www/html (o ajusta el script).

name: Deploy frontend

on:
  push:
    branches: [main, master]
    paths:
      - "front_despacho/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Install and build
        working-directory: front_despacho
        env:
          VITE_VENTAS_API_BASE: /api/ventas
          VITE_DESPACHOS_API_BASE: /api/despachos
        run: npm ci && npm run build

      - name: Pack static site
        run: tar -czf frontend-dist.tgz -C front_despacho/dist .

      - name: Upload and publish over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_FRONTEND_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/ec2_deploy_key -o StrictHostKeyChecking=accept-new \
            frontend-dist.tgz "${USER}@${HOST}:/tmp/frontend-dist.tgz"
          ssh -i ~/.ssh/ec2_deploy_key -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            "set -e; sudo mkdir -p /var/www/html; sudo tar -xzf /tmp/frontend-dist.tgz -C /var/www/html; sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload"

# Despliegue del API de despachos (puerto 8081 en EC2 backend).
# Mismos secretos que deploy-backend-ventas.yml (misma EC2 de aplicación).

name: Deploy backend despachos

on:
  push:
    branches: [main, master]
    paths:
      - "back-Despachos_SpringBoot/**"
      - ".github/workflows/deploy-backend-despachos.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-despachos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/pom.xml

      - name: Build JAR
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: chmod +x mvnw && ./mvnw -B -ntp package -DskipTests

      - name: Pack bundle
        run: |
          mkdir -p pack-despachos
          cp back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile pack-despachos/
          cp back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/target/*.jar pack-despachos/app.jar
          tar -czf despachos-bundle.tgz -C pack-despachos .

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: despachos-bundle.tgz
          target: /tmp/

      - name: Build image and run container
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD
          script_stop: true
          script: |
            set -e
            mkdir -p /opt/innovatech/despachos
            tar -xzf /tmp/despachos-bundle.tgz -C /opt/innovatech/despachos
            cd /opt/innovatech/despachos
            docker build -t innovatech-despachos:latest .
            docker stop innovatech-despachos 2>/dev/null || true
            docker rm innovatech-despachos 2>/dev/null || true
            docker run -d --name innovatech-despachos --restart unless-stopped -p 8081:8081 \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              innovatech-despachos:latest

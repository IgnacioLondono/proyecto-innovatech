# Despliegue del API de ventas (puerto 8082 en EC2 backend).
# Secretos: EC2_BACKEND_HOST, EC2_USER, EC2_SSH_KEY,
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Opcional (solo si añades pasos aws CLI / ECR): descomenta el bloque de credenciales
# y define AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, aws-region.

name: Deploy backend ventas

on:
  push:
    branches: [main, master]
    paths:
      - "back-Ventas_SpringBoot/**"
      - ".github/workflows/deploy-backend-ventas.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-ventas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Configure AWS credentials (AWS Academy — usar si agregas aws/ECR/S3)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      #     aws-region: us-east-1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back-Ventas_SpringBoot/Springboot-API-REST/pom.xml

      - name: Build JAR
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: chmod +x mvnw && ./mvnw -B -ntp package -DskipTests

      - name: Pack bundle
        run: |
          mkdir -p pack-ventas
          cp back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile pack-ventas/
          cp back-Ventas_SpringBoot/Springboot-API-REST/target/*.jar pack-ventas/app.jar
          tar -czf ventas-bundle.tgz -C pack-ventas .

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ventas-bundle.tgz
          target: /tmp/

      - name: Build image and run container
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD
          script_stop: true
          script: |
            set -e
            mkdir -p /opt/innovatech/ventas
            tar -xzf /tmp/ventas-bundle.tgz -C /opt/innovatech/ventas
            cd /opt/innovatech/ventas
            docker build -t innovatech-ventas:latest .
            docker stop innovatech-ventas 2>/dev/null || true
            docker rm innovatech-ventas 2>/dev/null || true
            docker run -d --name innovatech-ventas --restart unless-stopped -p 8082:8082 \
              -e SERVER_PORT=8082 \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              innovatech-ventas:latest

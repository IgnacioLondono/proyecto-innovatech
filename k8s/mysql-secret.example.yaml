# Plantilla de secret MySQL — NO commitear credenciales reales.
# Copiar y ajustar valores, o crear el secret desde GitHub Secrets en CI/CD.
#
# Uso local:
#   cp k8s/mysql-secret.example.yaml k8s/mysql-secret.yaml
#   # Editar credenciales en mysql-secret.yaml
#   kubectl apply -f k8s/mysql-secret.yaml
#
# En GitHub Actions el secret se crea automáticamente (ver deploy-k8s.yaml).

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CAMBIAR_ROOT_PASSWORD
  MYSQL_DATABASE: innovatech_db
  MYSQL_USER: admin
  MYSQL_PASSWORD: CAMBIAR_PASSWORD

# Horizontal Pod Autoscaler (HPA) - EKS
# Requiere metrics-server instalado en el clúster (ver scripts/setup-eks.sh)
#
# Justificación de umbrales:
# - CPU 70%: escala antes de saturación total, deja margen para picos
# - Memory 80%: evita OOMKill manteniendo uso eficiente de memoria
# - minReplicas 2: alta disponibilidad (tolerancia a fallo de un pod)
# - maxReplicas 5: límite de costo en AWS Academy Learner Lab

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-despacho
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

